{% extends "base.html" %}
{% block title %}Log in · Secure Login{% endblock %}
{% block content %}
<section class="panel">
  <h2>Welcome back</h2>
  <p class="muted">Log in to continue to your account.</p>
  <form method="post" action="{{ url_for('login') }}">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" minlength="3" maxlength="30" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
  </form>
  <p class="switch">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</section>
{% endblock %}
